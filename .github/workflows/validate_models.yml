name: Multi-Physics Infrastructure Integration Regression Tests
on: [push, pull_request]

jobs:
  run-repository-validation-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repositories
        uses: actions/checkout@v4

      - name: Initialize Standard Python Testing Stack
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Provision Project Third-Party Mathematical Infrastructure
        run: |
          pip install pandas numpy

      - name: Assert Workspace Integrity Footprints
        run: |
          test -f simulation/run_simulation.dat || (echo "Calculation Deck Missing" && exit 1)
          test -f scripts/run_ansys_batch.py || (echo "Automation Orchestrator Core Missing" && exit 1)
          test -f scripts/run_ansys_batch.bat || (echo "Windows Wrapper Interface Missing" && exit 1)

      - name: Run Script Regression Linting Verification Tests
        run: |
          python -m py_compile scripts/run_ansys_batch.py
          python -m py_compile scripts/extract_results.py
